backend = "mame"

[[case]]
id = "boot_smoke"
script = "boot_smoke.lua"
timeout_seconds = 20
description = "Boots the ROM, validates the exported signature and scene, then exits cleanly."

[[case]]
id = "frame_progress"
script = "frame_progress.lua"
timeout_seconds = 20
description = "Verifies that the exported frame counter continues to increase."

[[case]]
id = "input_right"
script = "input_right.lua"
timeout_seconds = 20
description = "Injects Right and verifies that the exported player position increases."

[[case]]
id = "audio_smoke"
script = "audio_smoke.lua"
timeout_seconds = 20
description = "Verifies scene music, all four APU voices, and a gameplay cue."

[[case]]
id = "battle_cadence"
script = "battle_cadence.lua"
timeout_seconds = 30
description = "Requires gameplay and music to remain locked to the 60 Hz video clock during battle."

[[case]]
id = "combat_presentation"
script = "combat_presentation.lua"
timeout_seconds = 20
description = "Drives a real hit and verifies synchronized damage, spark, cue, and recovery."

[[case]]
id = "animation_states"
script = "animation_states.lua"
timeout_seconds = 75
description = "Drives every fighter through every authored idle, walk, jump, jab, and special pose."

[[case]]
id = "menu_presentation"
script = "menu_presentation.lua"
timeout_seconds = 25
description = "Checks title and lobby animation progression, their sprite budgets, and Start/Select scene timing."

[[case]]
id = "platform_landing"
script = "platform_landing.lua"
timeout_seconds = 40
description = "Checks both edges reject landing from below, allow rising through the platform, and land only from above."

[[case]]
id = "melee_trade"
script = "melee_trade.lua"
timeout_seconds = 20
description = "Requires simultaneous mirror jabs to trade damage, cancel both actions, and recover without repeated hits."

[[case]]
id = "cpu_recovery"
script = "cpu_recovery.lua"
timeout_seconds = 30
description = "Baits a CPU offstage through real inputs and requires an inward recovery jump and landing without a KO."

[[case]]
id = "tas_mario"
script = "tas_mario.lua"
timeout_seconds = 60
description = "Runs Mario's deterministic full-state TAS, validates the jump arc, and captures sixteen DMA-aligned screenshots."

[[case]]
id = "tas_simon"
script = "tas_simon.lua"
timeout_seconds = 60
description = "Runs Simon's deterministic full-state TAS, validates the jump arc, and captures sixteen DMA-aligned screenshots."

[[case]]
id = "tas_tommy"
script = "tas_tommy.lua"
timeout_seconds = 60
description = "Runs Tommy's deterministic full-state TAS, validates the jump arc, and captures sixteen DMA-aligned screenshots."

[[case]]
id = "tas_rizer"
script = "tas_rizer.lua"
timeout_seconds = 60
description = "Runs Rizer's deterministic full-state TAS, validates all four tumble poses and the jump arc, and captures seventeen DMA-aligned screenshots."

[[case]]
id = "rizer_aerial_fire"
script = "rizer_aerial_fire.lua"
timeout_seconds = 30
description = "Proves Rizer keeps the original four-pose curl while an aerial bullet is active."

[[case]]
id = "long_stability"
script = "long_stability.lua"
timeout_seconds = 35
description = "Runs a longer session and checks that the runtime remains responsive."
