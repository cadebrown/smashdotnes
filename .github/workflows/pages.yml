name: Build And Deploy Web

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cc65

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        # Keep this pinned to the same major/minor used by `web/Cargo.toml`.
        run: cargo install dioxus-cli --version 0.7.2 --locked

      - name: Build ROM + Sync Web Assets
        run: make web-sync

      - name: Build Web Bundle
        run: dx build --platform web --package smash-web

      - name: Stage Static Site
        run: |
          rm -rf site
          mkdir -p site
          cp -R target/dx/smash-web/debug/web/public/. site/

      - name: Upload Pages Artifact
        # Build PRs for validation, but only publish artifacts for non-PR runs.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
