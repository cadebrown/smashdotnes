<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6e7e2" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Build provenance and published artifacts for Smash.NES." />
    <title>Build — Smash.NES</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%224%22 fill=%22%23070808%22/><path d=%22M7 9h18v4H11v3h12v4H11v3h14v4H7z%22 fill=%22%23e64b31%22/></svg>" />
    <link rel="stylesheet" href="../main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to build details</a>
    <main id="main" class="page-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Smash.NES home">
          <span>SMASH.NES</span>
        </a>
        <nav class="topnav" aria-label="Primary navigation">
          <a href="/">Play</a>
          <a href="/docs/">Manual</a>
          <a href="/info/" aria-current="page">Build</a>
        </nav>
      </header>

      <section class="panel page-copy">
        <h1 class="page-title">Build details</h1>
        <p class="muted">Source revision and ROM for this version of the game.</p>
      </section>

      <section class="panel page-copy">
        <div class="kv" id="snapshot"></div>
      </section>

      <section class="panel page-copy">
        <details>
          <summary class="muted">View raw build data</summary>
          <pre class="raw-json" id="raw-json">loading...</pre>
        </details>
      </section>
    </main>

    <script>
      function appendKV(target, key, value) {
        const row = document.createElement("div");
        row.className = "kv-row";
        const k = document.createElement("span");
        k.className = "kv-key";
        k.textContent = key;
        const v = document.createElement("span");
        v.className = "kv-val";
        v.textContent = value == null || value === "" ? "(not available)" : String(value);
        row.appendChild(k);
        row.appendChild(v);
        target.appendChild(row);
      }

      function fillSnapshot(data) {
        const el = document.getElementById("snapshot");
        if (!el) return;
        appendKV(el, "Project", data.project);
        appendKV(el, "Built", data.generated_at_unix == null ? null : new Date(data.generated_at_unix * 1000).toLocaleString());
        appendKV(el, "Author", data.author);
        appendKV(el, "ROM", data.rom_path);
        appendKV(el, "Branch", data.git && data.git.branch);
        appendKV(el, "Commit", data.git && data.git.commit);
        appendKV(el, "Uncommitted changes", data.git?.dirty == null ? null : data.git.dirty ? "Yes" : "None");
      }

      function setRawJson(data) {
        const raw = document.getElementById("raw-json");
        if (!raw) return;
        raw.textContent = JSON.stringify(data, null, 2);
      }

      fetch("build.json")
        .then((res) => {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        })
        .then((data) => {
          fillSnapshot(data);
          setRawJson(data);
        })
        .catch((err) => {
          const raw = document.getElementById("raw-json");
          if (raw) {
            raw.classList.add("error");
            raw.textContent = "error: could not load build.json: " + err.message;
          }
        });
    </script>
  </body>
</html>
