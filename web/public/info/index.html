<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>info</title>
    <link rel="stylesheet" href="../main.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="topbar">
        <a class="brand" href="/">SMASH.NES</a>
        <nav class="topnav">
          <a href="/play">Play</a>
          <a href="/docs">Docs</a>
          <a href="/info">Info</a>
        </nav>
      </header>

      <section class="panel page-copy">
        <h1 class="page-title">info</h1>
        <p class="muted">Autogenerated metadata for this publish bundle.</p>
      </section>

      <section class="panel page-copy">
        <h2>Build Snapshot</h2>
        <div class="kv" id="snapshot"></div>
      </section>

      <section class="panel page-copy">
        <h2>Published Routes</h2>
        <ul class="route-list" id="route-list"></ul>
      </section>

      <section class="panel page-copy">
        <h2>Raw Metadata</h2>
        <details>
          <summary class="muted">Show build.json</summary>
          <pre class="raw-json" id="raw-json">loading...</pre>
        </details>
      </section>
    </main>

    <script>
      function appendKV(target, key, value) {
        const row = document.createElement("div");
        row.className = "kv-row";
        const k = document.createElement("span");
        k.className = "kv-key";
        k.textContent = key;
        const v = document.createElement("span");
        v.className = "kv-val";
        v.textContent = value == null || value === "" ? "(not available)" : String(value);
        row.appendChild(k);
        row.appendChild(v);
        target.appendChild(row);
      }

      function fillSnapshot(data) {
        const el = document.getElementById("snapshot");
        if (!el) return;
        appendKV(el, "project", data.project);
        appendKV(el, "generated_at_unix", data.generated_at_unix);
        appendKV(el, "author", data.author);
        appendKV(el, "rom_path", data.rom_path);
        appendKV(el, "git.branch", data.git && data.git.branch);
        appendKV(el, "git.commit", data.git && data.git.commit);
        appendKV(el, "git.dirty", data.git && data.git.dirty);
        appendKV(el, "git.remote", data.git && data.git.remote);
      }

      function fillRoutes(links) {
        const el = document.getElementById("route-list");
        if (!el) return;
        if (!Array.isArray(links) || links.length === 0) {
          const li = document.createElement("li");
          li.className = "route-row";
          li.textContent = "No routes found.";
          el.appendChild(li);
          return;
        }
        for (const item of links) {
          const li = document.createElement("li");
          li.className = "route-row";
          const label = document.createElement("span");
          label.textContent = item.label || "route";
          const path = document.createElement("span");
          const link = document.createElement("a");
          link.href = item.url;
          link.textContent = item.url || "(missing)";
          path.appendChild(link);
          li.appendChild(label);
          li.appendChild(path);
          el.appendChild(li);
        }
      }

      function setRawJson(data) {
        const raw = document.getElementById("raw-json");
        if (!raw) return;
        raw.textContent = JSON.stringify(data, null, 2);
      }

      fetch("build.json")
        .then((res) => {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        })
        .then((data) => {
          fillSnapshot(data);
          fillRoutes(data.links);
          setRawJson(data);
        })
        .catch((err) => {
          const raw = document.getElementById("raw-json");
          if (raw) {
            raw.classList.add("error");
            raw.textContent = "error: could not load build.json: " + err.message;
          }
        });
    </script>
  </body>
</html>
