<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>play</title>
    <link rel="stylesheet" href="../main.css" />
  </head>
  <body>
    <main class="page-shell play-shell">
      <header class="topbar">
        <a class="brand" href="/">SMASH.NES</a>
        <nav class="topnav">
          <a href="/play">Play</a>
          <a href="/docs">Docs</a>
          <a href="/info">Info</a>
        </nav>
      </header>

      <div class="emu-frame" id="frame">
        <div id="game"></div>
      </div>

      <p id="status" class="status">Loading EmulatorJS…</p>
      <p class="meta">Click the screen, then use WASD + J/K + Enter + '.</p>
    </main>

    <script>
      window.EJS_player = "#game";
      window.EJS_core = "nes";
      window.EJS_gameUrl = "../rom/smash.nes";
      window.EJS_gameName = "SmashDotNES";
      window.EJS_pathtodata = "../assets/emulatorjs/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_backgroundColor = "#000000";
      window.EJS_color = "#ef2f2f";
      window.EJS_threads = false;
      window.EJS_disableDatabases = true;
      window.EJS_paths = {
        "version.json": "../assets/emulatorjs/data/version.json"
      };

      // EmulatorJS defaults to a remote CDN version fetch. Rewrite that request
      // to the vendored local file so the player works with zero network access.
      (function patchVersionFetchForOffline() {
        const remoteVersion = "https://cdn.emulatorjs.org/stable/data/version.json";
        const localVersion = "../assets/emulatorjs/data/version.json";
        if (typeof window.fetch !== "function") return;
        const originalFetch = window.fetch.bind(window);
        window.fetch = function patchedFetch(input, init) {
          const requestUrl = typeof input === "string" ? input : (input && input.url) || "";
          if (requestUrl === remoteVersion) {
            return originalFetch(localVersion, init);
          }
          return originalFetch(input, init);
        };
      })();

      // EmulatorJS key setup expects control slots 0..29 to exist; sparse maps
      // can trigger `setupKeys` runtime errors. Keep a full object shape.
      // NES mapping: BUTTON_1 = B, BUTTON_2 = A.
      window.EJS_defaultControls = {
        0: {
          0: { value: "k", value2: "BUTTON_2" },
          1: { value: "c", value2: "BUTTON_4" },
          2: { value: "single quote", value2: "SELECT" },
          3: { value: "enter", value2: "START" },
          4: { value: "w", value2: "DPAD_UP" },
          5: { value: "s", value2: "DPAD_DOWN" },
          6: { value: "a", value2: "DPAD_LEFT" },
          7: { value: "d", value2: "DPAD_RIGHT" },
          8: { value: "j", value2: "BUTTON_1" },
          9: { value: "v", value2: "BUTTON_3" },
          10: { value: "q", value2: "LEFT_TOP_SHOULDER" },
          11: { value: "e", value2: "RIGHT_TOP_SHOULDER" },
          12: { value: "tab", value2: "LEFT_BOTTOM_SHOULDER" },
          13: { value: "r", value2: "RIGHT_BOTTOM_SHOULDER" },
          14: { value: "", value2: "LEFT_STICK" },
          15: { value: "", value2: "RIGHT_STICK" },
          16: { value: "h", value2: "LEFT_STICK_X:+1" },
          17: { value: "f", value2: "LEFT_STICK_X:-1" },
          18: { value: "g", value2: "LEFT_STICK_Y:+1" },
          19: { value: "t", value2: "LEFT_STICK_Y:-1" },
          20: { value: "l", value2: "RIGHT_STICK_X:+1" },
          21: { value: "j", value2: "RIGHT_STICK_X:-1" },
          22: { value: "k", value2: "RIGHT_STICK_Y:+1" },
          23: { value: "i", value2: "RIGHT_STICK_Y:-1" },
          24: { value: "1" },
          25: { value: "2" },
          26: { value: "3" },
          27: { value: "add" },
          28: { value: "space" },
          29: { value: "subtract" }
        },
        1: {},
        2: {},
        3: {}
      };

      window.addEventListener("load", function onLoad() {
        const status = document.getElementById("status");
        if (status) status.textContent = "Ready";
      });
    </script>
    <script
      src="../assets/emulatorjs/data/loader.js"
      onerror="document.getElementById('status').textContent = 'EmulatorJS failed to load (local assets missing)'"
    ></script>
  </body>
</html>
