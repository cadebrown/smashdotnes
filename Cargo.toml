[workspace]
members = [
    "nessy",
    "web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SmashDotNES contributors"]

[workspace.dependencies]
anyhow = "1.0.97"
clap = { version = "4.5.31", features = ["derive"] }
image = { version = "0.25.5", default-features = false, features = ["png"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.11"
toml = "0.8.20"
walkdir = "2.5.0"
pulldown-cmark = "0.13.0"
